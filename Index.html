<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toolix • IP &amp; DNS Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
        
        :root {
            --primary: #0ea5e9;
        }
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
        }
        
        .font-display {
            font-family: 'Space Grotesk', 'Inter', system_ui, sans-serif;
            font-weight: 600;
        }

        .glass {
            background: rgba(255,255,255, 0.06);
            backdrop-filter: blur(16px);
        }

        .section-header {
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 600;
            color: #64748b;
        }

        .info-row {
            transition: background-color 0.1s ease;
        }
        
        .info-row:hover {
            background-color: rgba(148, 163, 184, 0.08);
        }

        .map-container {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        .ip-value {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-feature-settings: "ss02";
        }

        .result-card {
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), 
                       box-shadow 0.2s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .result-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        .stat-value {
            font-size: 1.1rem;
            line-height: 1.3;
            font-weight: 600;
        }

        .nav-active {
            color: white;
            background-color: rgba(148, 163, 184, 0.15);
        }

        .toast {
            animation: toast-pop-in 0.2s ease forwards;
        }

        @keyframes toast-pop-in {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .leaflet-popup-content-wrapper {
            background: #18181b;
            color: #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
        }
        
        .leaflet-popup-tip {
            background: #18181b;
        }

        .metric {
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200">
    <!-- Navbar -->
    <nav class="border-b border-zinc-800 bg-zinc-950/80 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-screen-xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <!-- Logo -->
                <div class="flex items-center gap-x-2.5">
                    <div class="w-9 h-9 bg-teal-600 rounded-2xl flex items-center justify-center shadow-inner">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.25">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 4.01V8" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
                        </svg>
                    </div>
                    <div class="flex items-baseline gap-x-2">
                        <span class="font-display text-2xl font-semibold tracking-tighter">toolix</span>
                        <span class="text-[10px] font-mono px-1.5 py-px rounded bg-zinc-800 text-zinc-400 border border-zinc-700">IP</span>
                    </div>
                </div>
                <div class="hidden md:flex items-center text-xs px-3 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-400">
                    <div class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse mr-1.5"></div>
                    LIVE DATA
                </div>
            </div>
            
            <!-- Tabs -->
            <div class="flex items-center gap-x-1 text-sm bg-zinc-900 border border-zinc-800 rounded-2xl p-1">
                <button onclick="switchTab('ip')" id="tab-ip"
                        class="px-4 py-1.5 rounded-xl bg-zinc-800 text-white font-medium transition-all text-sm">IP</button>
                <button onclick="switchTab('dns')" id="tab-dns"
                        class="px-4 py-1.5 rounded-xl text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 transition-all text-sm">DNS</button>
                <button onclick="switchTab('test')" id="tab-test"
                        class="px-4 py-1.5 rounded-xl text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 transition-all text-sm">DNS Test</button>
            </div>
            
            <div class="flex items-center gap-x-2 text-sm">
                <a href="#" onclick="showAbout()" 
                   class="px-4 py-2 text-zinc-400 hover:text-zinc-200 transition-colors">About</a>
            </div>
        </div>
    </nav>

    <!-- IP Lookup Section -->
    <div id="ip-section" class="max-w-screen-xl mx-auto px-6 pt-14 pb-10">
        <!-- Your full IP Lookup content goes here -->
        <!-- (The complete code from the current file) -->
    </div>

    <!-- DNS Lookup Section -->
    <div id="dns-section" class="hidden max-w-screen-xl mx-auto px-6 pt-8 pb-16">
        <!-- Your full DNS Lookup content -->
    </div>

    <!-- DNS Provider Test Section -->
    <div id="test-section" class="hidden max-w-screen-xl mx-auto px-6 pt-8 pb-16">
        <!-- Your full DNS Test content -->
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-[999]"></div>

    <!-- Footer -->
    <footer class="border-t border-zinc-800 py-8 mt-auto">
        <div class="max-w-screen-xl mx-auto px-6 text-center">
            <div class="flex flex-col md:flex-row items-center justify-center gap-x-6 gap-y-2 text-xs text-zinc-500">
                <div>
                    <a href="https://toolix.io" target="_blank" class="hover:text-zinc-300 underline">toolix.io</a>
                </div>
                <div class="hidden md:block">•</div>
                <div>Powered by <a href="https://ipapi.co" target="_blank" class="hover:text-zinc-400 underline">ipapi.co</a> • Leaflet • OpenStreetMap</div>
                <div class="hidden md:block">•</div>
                <div>Free for personal &amp; non-commercial use • Data may be cached</div>
                <div class="hidden md:block">•</div>
                <div onclick="showAbout()" class="cursor-pointer hover:text-zinc-400">Privacy &amp; Limitations</div>
            </div>
        </div>
    </footer>

    <!-- Full JavaScript (all functions: IP, DNS, DNS Test, etc.) -->
    <script>
        // All your JavaScript code goes here
        // (switchTab, performLookup, runDNSTest, etc.)
    </script>
</body>
</html>
